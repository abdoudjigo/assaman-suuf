name: CI - Assaman & Suuf Core Data

# Tests sur CHAQUE push (toutes les branches dev/*, develop, main)
# et sur chaque PR vers develop / main.
on:
  push:
    branches: ["**"]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

# Un nouveau push sur la même branche annule le run précédent.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # Même version que les images Docker (le .pkl est relu avec la même
  # version de Python / scikit-learn que celle qui l'a entraîné).
  PYTHON_VERSION: "3.14"

jobs:

  # ---------------------------------------------------------------------
  # 1. Lint & formatage Python
  #    Indépendant des tests : un problème de style ne masque pas un test cassé.
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les outils de lint
        run: pip install ruff==0.16.10 black==26.10.0

      - name: Lint Python (ruff)
        run: ruff check .

      - name: Vérifier le formatage (black)
        run: black --check .

  # ---------------------------------------------------------------------
  # 2. Tests ML (préparation du dataset, entraînement, non-fuite du test)
  # ---------------------------------------------------------------------
  test-ml:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: ml/requirements*.txt

      - name: Installer les dépendances (ML)
        run: pip install -r ml/requirements-runtime.txt pytest pytest-cov

      - name: Tests ML
        run: pytest tests/test_ml/ --cov=ml --cov-report=xml:coverage-ml.xml

      - name: Upload couverture (ML)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ml
          path: coverage-ml.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 3. Tests API FastAPI (TestClient, Snowflake / ML simulés)
  # ---------------------------------------------------------------------
  test-api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: |
            ml/requirements-runtime.txt
            api/requirements.txt

      # L'API importe le paquet ml : mêmes dépendances que l'image Docker.
      - name: Installer les dépendances (API)
        run: pip install -r ml/requirements-runtime.txt -r api/requirements.txt

      # main.py importe `routers`, `schemas`... à plat (comme dans l'image) :
      # api/ doit être dans le PYTHONPATH, en plus de la racine (paquet ml).
      - name: Tests API
        env:
          PYTHONPATH: ${{ github.workspace }}/api:${{ github.workspace }}
        run: pytest tests/test_api/ --cov=api --cov-report=xml:coverage-api.xml

      - name: Upload couverture (API)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: coverage-api.xml
          if-no-files-found: ignore

  # ---------------------------------------------------------------------
  # 4. dbt : vérification du projet sans connexion Snowflake
  #    `dbt parse` valide le Jinja, les ref()/source() et les schema.yml.
  #    Le `dbt build` réel reste manuel / Airflow (l'utilisateur dbt
  #    actuel est en MFA, inutilisable depuis la CI).
  # ---------------------------------------------------------------------
  dbt-parse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer dbt
        run: pip install dbt-snowflake

      - name: Profil factice (aucune connexion n'est ouverte)
        run: |
          mkdir -p ~/.dbt
          cat > ~/.dbt/profiles.yml <<'EOF'
          dataflow360:
            target: ci
            outputs:
              ci:
                type: snowflake
                account: ci
                user: ci
                password: ci
                role: ci
                database: ci
                warehouse: ci
                schema: ci
                threads: 1
          EOF

      - name: dbt parse
        working-directory: dbt_project
        run: dbt parse --target ci

  # ---------------------------------------------------------------------
  # 5. Build Docker (API + ML) + smoke tests
  #    Contexte de build = racine du projet (l'API importe le paquet ml).
  # ---------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-ml, test-api]
    steps:
      - uses: actions/checkout@v4

      - name: Build image API
        run: docker build -t assaman-suuf-api:${{ github.sha }} -f api/Dockerfile .

      - name: Build image ML
        run: docker build -t assaman-suuf-ml:${{ github.sha }} -f ml/Dockerfile .

      - name: Smoke test - API (le conteneur démarre et /health répond)
        run: |
          docker run -d --name api-test -p 8000:8000 assaman-suuf-api:${{ github.sha }}
          for i in $(seq 1 30); do
            curl -fs http://localhost:8000/health && exit 0
            sleep 1
          done
          docker logs api-test
          exit 1

      # L'image ML est un job batch (export / entraînement) qui a besoin de
      # Snowflake ou d'un parquet : on vérifie seulement que le code s'importe.
      - name: Smoke test - ML (les modules s'importent)
        run: |
          docker run --rm assaman-suuf-ml:${{ github.sha }} \
            python -c "import ml.service_prediction, ml.scripts.entrainement, ml.scripts.export_dataset"

  # ---------------------------------------------------------------------
  # 6. Deploy - publie les images sur GitHub Container Registry
  #    Uniquement sur un push sur main, si tout est vert.
  # ---------------------------------------------------------------------
  deploy:
    runs-on: ubuntu-latest
    needs: [lint, test-ml, test-api, dbt-parse, docker-build]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    permissions:
      packages: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Connexion à GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build + push images API et ML
        run: |
          OWNER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          for svc in api ml; do
            IMAGE=ghcr.io/$OWNER/assaman-suuf-$svc
            docker build -t $IMAGE:${{ github.sha }} -t $IMAGE:latest -f $svc/Dockerfile .
            docker push $IMAGE:${{ github.sha }}
            docker push $IMAGE:latest
          done

      # Étape suivante (environnement Dev réel non encore provisionné) :
      # SSH vers le serveur Dev + docker compose pull && up -d
      # ou déploiement vers un service cloud (Render, Railway, VM Orange...)

  # ---------------------------------------------------------------------
  # 7. Statut final (à mettre en "required check" sur develop / main)
  # ---------------------------------------------------------------------
  ci-status:
    runs-on: ubuntu-latest
    needs: [lint, test-ml, test-api, dbt-parse, docker-build]
    if: always()
    steps:
      - name: Vérifier que tous les jobs ont réussi
        run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "Au moins un job a échoué ou a été annulé."
            exit 1
          fi
          echo "Pipeline CI/CD réussi."
