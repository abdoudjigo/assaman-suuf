name: CI - DataFlow360 Core Data

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHON_VERSION: "3.11"

jobs:

  # ---------------------------------------------------------------------
  # 1. Lint & formatage (Python + dbt/SQL)
  # ---------------------------------------------------------------------
  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout du code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les outils de lint
        run: pip install ruff black sqlfluff

      - name: Lint Python (ruff)
        run: ruff check .

      - name: Vérifier le formatage (black)
        run: black --check .

      - name: Lint SQL/dbt (sqlfluff)
        run: sqlfluff lint dbt_project/models --dialect snowflake

  # ---------------------------------------------------------------------
  # 2. Tests unitaires - Ingestion Python
  # ---------------------------------------------------------------------
  test-ingestion:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances (ingestion)
        run: pip install -r ingestion/requirements.txt

      - name: Lancer les tests pytest
        run: pytest tests/test_ingestion/ --cov=ingestion --cov-report=xml

      - name: Upload couverture (ingestion)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ingestion
          path: coverage.xml

  # ---------------------------------------------------------------------
  # 3. Tests unitaires / intégration - API FastAPI
  # ---------------------------------------------------------------------
  test-api:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances (API)
        run: pip install -r api/requirements.txt

      - name: Lancer les tests pytest (TestClient)
        run: pytest tests/test_api/ --cov=api --cov-report=xml

      - name: Upload couverture (API)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-api
          path: coverage.xml

  # ---------------------------------------------------------------------
  # 4. Tests ML - non-régression (XGBoost / Random Forest / LightGBM)
  # ---------------------------------------------------------------------
  test-ml:
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer les dépendances (ML)
        run: pip install -r ml/requirements.txt

      - name: Tests unitaires ML
        run: pytest tests/test_ml/ --cov=ml --cov-report=xml

      - name: Test de non-régression (MAE/RMSE vs baseline)
        run: python ml/scripts/check_regression.py --models xgboost randomforest lightgbm

      - name: Upload couverture (ML)
        uses: actions/upload-artifact@v4
        with:
          name: coverage-ml
          path: coverage.xml

  # ---------------------------------------------------------------------
  # 5. Build & tests dbt (Snowflake)
  # ---------------------------------------------------------------------
  dbt-build:
    runs-on: ubuntu-latest
    needs: lint
    env:
      DBT_PROFILES_DIR: ./dbt_project
      SNOWFLAKE_ACCOUNT: ${{ secrets.SNOWFLAKE_ACCOUNT }}
      SNOWFLAKE_USER: ${{ secrets.SNOWFLAKE_USER }}
      SNOWFLAKE_PASSWORD: ${{ secrets.SNOWFLAKE_PASSWORD }}
      SNOWFLAKE_ROLE: ${{ secrets.SNOWFLAKE_ROLE }}
      SNOWFLAKE_DATABASE: ${{ secrets.SNOWFLAKE_DATABASE }}
      SNOWFLAKE_WAREHOUSE: ${{ secrets.SNOWFLAKE_WAREHOUSE }}
      SNOWFLAKE_SCHEMA: ${{ secrets.SNOWFLAKE_SCHEMA_DEV }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Installer dbt
        run: pip install dbt-snowflake

      - name: dbt deps
        working-directory: dbt_project
        run: dbt deps

      - name: dbt build (run + test)
        working-directory: dbt_project
        run: dbt build --target dev

  # ---------------------------------------------------------------------
  # 6. Build Docker (API + ML) - dépend des tests précédents
  # ---------------------------------------------------------------------
  docker-build:
    runs-on: ubuntu-latest
    needs: [test-ingestion, test-api, test-ml, dbt-build]
    steps:
      - uses: actions/checkout@v4

      - name: Build image API
        run: docker build -t dataflow360-api:${{ github.sha }} -f api/Dockerfile ./api

      - name: Build image ML
        run: docker build -t dataflow360-ml:${{ github.sha }} -f ml/Dockerfile ./ml

      - name: Smoke test - API (le conteneur démarre et répond)
        run: |
          docker run -d --name api-test -p 8000:8000 dataflow360-api:${{ github.sha }}
          sleep 5
          curl --fail http://localhost:8000/health || (docker logs api-test && exit 1)
          docker stop api-test

      - name: Smoke test - ML (le conteneur démarre)
        run: |
          docker run -d --name ml-test dataflow360-ml:${{ github.sha }}
          sleep 5
          docker ps --filter "name=ml-test" --filter "status=running" | grep ml-test || (docker logs ml-test && exit 1)
          docker stop ml-test

  # ---------------------------------------------------------------------
  # 7. Statut final
  # ---------------------------------------------------------------------
  ci-status:
    runs-on: ubuntu-latest
    needs: [lint, test-ingestion, test-api, test-ml, dbt-build, docker-build]
    if: always()
    steps:
      - name: Vérifier que tous les jobs ont réussi
        run: |
          if [ "${{ contains(needs.*.result, 'failure') }}" = "true" ]; then
            echo "Au moins un job a échoué."
            exit 1
          fi
          echo "Pipeline CI/CD réussi."