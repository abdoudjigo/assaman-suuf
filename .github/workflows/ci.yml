name: CI

# Déclenchement : sur PR vers develop et main, et sur push vers develop et main
on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # Cache des dépendances pip pour accélérer les builds
      - name: Mettre en cache les dépendances pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          # Optionnel : installer pytest-cov pour la couverture
          # pip install pytest-cov

      - name: Vérifier le style du code (flake8)
        run: python -m flake8 . --max-line-length=100

      - name: Lancer les tests
        run: |
          pytest tests/ -v
          code=$?
          if [ $code -eq 5 ]; then
            echo "Aucun test collecté pour l'instant, on laisse passer."
            exit 0
          fi
          exit $code