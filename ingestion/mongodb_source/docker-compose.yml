services:

  # =========================================================
  # MONGODB
  # =========================================================
  mongodb:
    image: mongo:8
    container_name: dataflow360-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dataflow360
    volumes:
      - mongodb_data:/data/db


  # =========================================================
  # APACHE NIFI
  # =========================================================
  nifi:
    image: apache/nifi:2.6.0
    container_name: dataflow360-nifi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: DataFlow360_NiFi_2026!
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository


# ===========================================================
# VOLUMES
# ===========================================================
volumes:

  # les 3011 documents agricoles.
  mongodb_data:
    external: true
    name: mongodb_source_mongodb_data

  # NiFi
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance: