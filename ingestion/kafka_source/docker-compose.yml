services:

  kafka:
    image: apache/kafka:3.7.0
    container_name: dataflow360-kafka
    ports:
      - "9092:9092"      # broker, accessible depuis l'hôte (producer.py)
      - "9094:9094"      # listener interne inter-conteneurs
    environment:
      # Mode KRaft : pas besoin de Zookeeper séparé
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL
      # Identifiant fixe du cluster (permet des redémarrages cohérents en local)
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk
      # Topic agriculture créé automatiquement au démarrage, 1 partition (cf. décision projet)
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true

      # Cluster mono-broker
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD", "/opt/kafka/bin/kafka-topics.sh", "--bootstrap-server", "localhost:9092", "--list"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dataflow360-kafka-ui
    depends_on:
      - kafka
    ports:
      - "8090:8080"        # interface web : http://localhost:8090
    environment:
      - KAFKA_CLUSTERS_0_NAME=dataflow360
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094

  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: dataflow360-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"         # API REST Kafka Connect
    # mem_limit: 1800m
    environment:
      - KAFKA_HEAP_OPTS=-Xms384M -Xmx1024M
      - CONNECT_BOOTSTRAP_SERVERS=kafka:9094
      - CONNECT_REST_PORT=8083
      - CONNECT_GROUP_ID=dataflow360-connect
      - CONNECT_CONFIG_STORAGE_TOPIC=_connect-configs
      - CONNECT_OFFSET_STORAGE_TOPIC=_connect-offsets
      - CONNECT_STATUS_STORAGE_TOPIC=_connect-status
      - CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_STATUS_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_KEY_CONVERTER=org.apache.kafka.connect.storage.StringConverter
      - CONNECT_VALUE_CONVERTER=org.apache.kafka.connect.storage.StringConverter
      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-connect
      - CONNECT_PLUGIN_PATH=/usr/share/java/kafka-connect,/etc/kafka-connect/jars
    volumes:
      # Place ici le .jar du Snowflake Kafka Connector téléchargé (voir étape suivante)
      - plugins:/etc/kafka-connect/jars

volumes:
  kafka_data: