services:

  # =========================================================
  # KAFKA
  # =========================================================
  kafka:
    image: apache/kafka:4.2.2
    container_name: dataflow360-kafka
    ports:
      - "9092:9092"
      - "9094:9094"
    environment:
      # Mode KRaft : pas de ZooKeeper
      - KAFKA_NODE_ID=1
      - KAFKA_PROCESS_ROLES=broker,controller
      - KAFKA_CONTROLLER_QUORUM_VOTERS=1@kafka:9093

      # Listeners
      - KAFKA_LISTENERS=PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:9093,INTERNAL://0.0.0.0:9094
      - KAFKA_ADVERTISED_LISTENERS=PLAINTEXT://localhost:9092,INTERNAL://kafka:9094
      - KAFKA_LISTENER_SECURITY_PROTOCOL_MAP=CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,INTERNAL:PLAINTEXT
      - KAFKA_CONTROLLER_LISTENER_NAMES=CONTROLLER
      - KAFKA_INTER_BROKER_LISTENER_NAME=INTERNAL

      # Cluster ID fixe
      - CLUSTER_ID=MkU3OEVBNTcwNTJENDM2Qk

      # Topics / environnement local
      - KAFKA_AUTO_CREATE_TOPICS_ENABLE=true
      - KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR=1
      - KAFKA_TRANSACTION_STATE_LOG_MIN_ISR=1

    volumes:
      - kafka_data:/var/lib/kafka/data

    healthcheck:
      test:
        [
          "CMD",
          "/opt/kafka/bin/kafka-topics.sh",
          "--bootstrap-server",
          "localhost:9092",
          "--list"
        ]
      interval: 10s
      timeout: 5s
      retries: 5


  # =========================================================
  # KAFKA UI
  # =========================================================
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: dataflow360-kafka-ui
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8090:8080"
    environment:
      - KAFKA_CLUSTERS_0_NAME=dataflow360
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9094


  # =========================================================
  # KAFKA CONNECT
  # =========================================================
  kafka-connect:
    image: confluentinc/cp-kafka-connect:7.6.0
    container_name: dataflow360-kafka-connect
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8083:8083"
    environment:
      - CONNECT_BOOTSTRAP_SERVERS=kafka:9094
      - CONNECT_REST_PORT=8083
      - CONNECT_GROUP_ID=dataflow360-connect

      # Topics internes Kafka Connect
      - CONNECT_CONFIG_STORAGE_TOPIC=_connect-configs
      - CONNECT_OFFSET_STORAGE_TOPIC=_connect-offsets
      - CONNECT_STATUS_STORAGE_TOPIC=_connect-status

      # Single broker
      - CONNECT_CONFIG_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_OFFSET_STORAGE_REPLICATION_FACTOR=1
      - CONNECT_STATUS_STORAGE_REPLICATION_FACTOR=1

      # Converters
      - CONNECT_KEY_CONVERTER=org.apache.kafka.connect.storage.StringConverter
      - CONNECT_VALUE_CONVERTER=org.apache.kafka.connect.storage.StringConverter

      - CONNECT_REST_ADVERTISED_HOST_NAME=kafka-connect
      - CONNECT_PLUGIN_PATH=/usr/share/java/kafka-connect,/etc/kafka-connect/jars

    volumes:
      - ./ingestion/kafka_source/plugins:/etc/kafka-connect/jars


  # =========================================================
  # MONGODB
  # =========================================================
  mongodb:
    image: mongo:8
    container_name: dataflow360-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: admin
      MONGO_INITDB_ROOT_PASSWORD: dataflow360
    volumes:
      - mongodb_data:/data/db


  # =========================================================
  # APACHE NIFI
  # =========================================================
  nifi:
    image: apache/nifi:2.6.0
    container_name: dataflow360-nifi
    restart: unless-stopped
    ports:
      - "8443:8443"
    environment:
      NIFI_WEB_HTTPS_PORT: 8443
      SINGLE_USER_CREDENTIALS_USERNAME: admin
      SINGLE_USER_CREDENTIALS_PASSWORD: DataFlow360_NiFi_2026!
    volumes:
      - nifi_conf:/opt/nifi/nifi-current/conf
      - nifi_state:/opt/nifi/nifi-current/state
      - nifi_database:/opt/nifi/nifi-current/database_repository
      - nifi_flowfile:/opt/nifi/nifi-current/flowfile_repository
      - nifi_content:/opt/nifi/nifi-current/content_repository
      - nifi_provenance:/opt/nifi/nifi-current/provenance_repository


# ===========================================================
# VOLUMES
# ===========================================================
volumes:

  # Kafka
  kafka_data:

  # MongoDB
  # IMPORTANT : on réutilise le volume existant contenant
  # nos 3011 documents.
  mongodb_data:
    external: true
    name: mongodb_source_mongodb_data

  # NiFi
  nifi_conf:
  nifi_state:
  nifi_database:
  nifi_flowfile:
  nifi_content:
  nifi_provenance: