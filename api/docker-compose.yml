services:

  api:
    build:
      context: ..
      dockerfile: api/Dockerfile
    image: dataflow360-api
    container_name: dataflow360-api
    ports:
      - "8001:8000"

    env_file:
      - .env

    environment:
      REDIS_HOST: redis
      REDIS_PORT: 6379

      SNOWFLAKE_PRIVATE_KEY_PATH: /run/secrets/snowflake_private_key
      SNOWFLAKE_PRIVATE_KEY_PASSWORD_FILE: /run/secrets/snowflake_private_key_password

    secrets:
      - snowflake_private_key
      - snowflake_private_key_password

    volumes:
      # Modèle produit par ml-entrainement, relu à chaque démarrage.
      - ../ml/models:/app/ml/models:ro

    depends_on:
      redis:
        condition: service_healthy

    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5

    restart: unless-stopped


  redis:
    image: redis:7-alpine
    container_name: dataflow360-api-redis

    restart: unless-stopped

    volumes:
      - redis_data:/data

    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5


volumes:
  redis_data:


secrets:

  snowflake_private_key:
    file: ./secrets/snowflake_api_key.pem

  snowflake_private_key_password:
    file: ./secrets/snowflake_api_key_password.txt