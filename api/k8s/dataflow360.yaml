apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataflow360-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataflow360-api
  template:
    metadata:
      labels:
        app: dataflow360-api
    spec:
      automountServiceAccountToken: false
      containers:
        - name: dataflow360-api
          image: abdou772/dataflow360-api:v1.0.0
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000

          envFrom:
            - configMapRef:
                name: dataflow360-api-config

          env:
            - name: REDIS_HOST
              value: dataflow360-redis-service
            - name: REDIS_PORT
              value: "6379"
            - name: SNOWFLAKE_PRIVATE_KEY_PATH
              value: /etc/snowflake-secrets/snowflake_private_key
            - name: SNOWFLAKE_PRIVATE_KEY_PASSWORD_FILE
              value: /etc/snowflake-secrets/snowflake_private_key_password

          volumeMounts:
            - name: snowflake-secrets
              mountPath: /etc/snowflake-secrets
              readOnly: true

          readinessProbe:
            httpGet:
              path: /health
              port: 8000
            timeoutSeconds: 2
            initialDelaySeconds: 5
            periodSeconds: 10
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /health
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

      volumes:
        - name: snowflake-secrets
          secret:
            secretName: snowflake-api-secrets

---
apiVersion: v1
kind: Service
metadata:
  name: dataflow360-api-service
spec:
  type: LoadBalancer
  selector:
    app: dataflow360-api
  ports:
    - port: 8001
      targetPort: 8000

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: dataflow360-redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: dataflow360-redis
  template:
    metadata:
      labels:
        app: dataflow360-redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - containerPort: 6379

---
apiVersion: v1
kind: Service
metadata:
  name: dataflow360-redis-service
spec:
  type: ClusterIP
  selector:
    app: dataflow360-redis
  ports:
    - port: 6379
      targetPort: 6379
