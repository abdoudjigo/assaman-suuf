version: 2

models:

  # Une ligne représente une zone, c'est-à-dire une région.
  - name: dim_zone
    columns:
      - name: zone_key
        tests:
          - not_null
          - unique

  # Une ligne représente un produit agricole.
  - name: dim_produit
    columns:
      - name: produit_key
        tests:
          - not_null
          - unique

  # Une ligne représente un mois d'une année.
  - name: dim_temps
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

  # Une ligne représente une station météorologique.
  - name: dim_station
    columns:
      - name: station_key
        tests:
          - not_null
          - unique

      - name: zone_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_key

  # Une ligne représente une observation / campagne agricole.
  # Les mois de semis et de récolte décrivent la campagne,
  # ils ne représentent pas une production mensuelle.
  - name: fct_agriculture
    columns:
      - name: zone_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_key

      - name: produit_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produit')
                field: produit_key

  # Une ligne représente une station pour une année et un mois.
  - name: fct_climat
    columns:
      - name: station_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_temps')
                field: date_key
