version: 2

models:

  # Une ligne représente une zone, c'est-à-dire une région.
  - name: dim_zone
    columns:
      - name: zone_key
        tests:
          - not_null
          - unique

      - name: region
        tests:
          - not_null
          - unique

  # Une ligne représente un produit agricole.
  - name: dim_produit
    columns:
      - name: produit_key
        tests:
          - not_null
          - unique

      - name: produit
        tests:
          - not_null
          - unique

  # Une ligne représente un mois d'une année.
  - name: dim_temps
    columns:
      - name: date_key
        tests:
          - not_null
          - unique

      - name: annee
        tests:
          - not_null

      - name: mois
        tests:
          - not_null

      - name: trimestre
        tests:
          - not_null
          - valeur_dans_intervalle:
              arguments:
                min_value: 1
                max_value: 4

  # Une ligne représente une station météorologique.
  - name: dim_station
    columns:
      - name: station_key
        tests:
          - not_null
          - unique

      - name: station
        tests:
          - not_null

      - name: zone_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_key

  # Une ligne représente une observation / campagne agricole.
  # Les mois de semis et de récolte décrivent la campagne,
  # ils ne représentent pas une production mensuelle.
  - name: fct_agriculture
    columns:
      - name: observation_id
        tests:
          - not_null
          - unique

      - name: zone_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: zone_key

      - name: produit_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produit')
                field: produit_key

      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['POSTGRES', 'MONGO', 'KAFKA']

  # Une ligne représente une station pour une année et un mois.
  - name: fct_climat
    tests:
      - combinaison_unique:
          arguments:
            colonnes: ['station_key', 'date_key']
    columns:
      - name: observation_id
        tests:
          - not_null
          - unique

      - name: station_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key

      - name: date_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_temps')
                field: date_key

  # Une ligne représente une station pour une année.
  - name: mart_climat_station_annee
    tests:
      - combinaison_unique:
          arguments:
            colonnes: ['station_key', 'annee']
    columns:
      - name: station_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_station')
                field: station_key

      - name: annee
        tests:
          - not_null

      # Au plus un relevé par mois et par station.
      - name: nombre_observations
        tests:
          - valeur_dans_intervalle:
              arguments:
                min_value: 1
                max_value: 12

  # Une ligne représente un produit pour une année de récolte.
  - name: mart_production_produit_annee
    tests:
      - combinaison_unique:
          arguments:
            colonnes: ['produit_key', 'annee']
    columns:
      - name: produit_key
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_produit')
                field: produit_key

      - name: production_totale_t
        tests:
          - valeur_dans_intervalle:
              arguments:
                min_value: 0

      - name: superficie_totale_ha
        tests:
          - valeur_dans_intervalle:
              arguments:
                min_value: 0

  # Une ligne représente une région pour une année de récolte.
  - name: mart_production_region_annee
    tests:
      - combinaison_unique:
          arguments:
            colonnes: ['region', 'annee']
    columns:
      - name: region
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_zone')
                field: region

      - name: production_totale_t
        tests:
          - valeur_dans_intervalle:
              arguments:
                min_value: 0

      - name: superficie_totale_ha
        tests:
          - valeur_dans_intervalle:
              arguments:
                min_value: 0
