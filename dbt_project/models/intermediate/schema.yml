version: 2

models:
  - name: int_agriculture
    columns:
      - name: source_system
        tests:
          - not_null
          - accepted_values:
              arguments:
                values: ['POSTGRES', 'MONGO', 'KAFKA']

      - name: annee_reference
        tests:
          - not_null

      - name: produit
        tests:
          - not_null
  # Une ligne représente une campagne agricole,
  # une station de sa région et un mois climatique de la campagne.
  - name: int_agroclimat
    columns:
      - name: agriculture_observation_id
        tests:
          - not_null

      - name: zone_key
        tests:
          - not_null

      - name: station_key
        tests:
          - not_null

      - name: date_key
        tests:
          - not_null

      - name: annee_climatique
        tests:
          - not_null

      - name: mois_climatique
        tests:
          - not_null
