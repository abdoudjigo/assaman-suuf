# C'est le fichier de configuration du projet dbt.
name: dataflow360
version: '1.0.0'
config-version: 2

profile: dataflow360

model-paths: ["models"]

models:
  dataflow360:
    staging:
      +materialized: view

    intermediate:
      +schema: INTERMEDIATE
      +materialized: view

    marts:
      +schema: MARTS
      +materialized: table

    ml:
      +schema: ML
      +materialized: table

vars:
  # Dernière année d'entraînement : les années suivantes forment le test,
  # et les normales climatiques ne sont calculées que jusqu'à cette année.
  # À fixer selon la plage réelle des données (garder ~20 % des années en test).
  ml_annee_fin_train: 2010
